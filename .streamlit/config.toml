# Thème clair imposé : les couleurs des graphiques (étiquettes DPE officielles, rampe bleue)
# ont été choisies et vérifiées pour un fond clair.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false
